<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body class="bg-[black]">
    <header class="bg-black p-4 flex items-center gap-3">
        <div class="bg-white rounded-lg w-9 h-9 flex items-center justify-center">
            🎬
        </div>
        <span class="font-bold text-lg text-white">Sériescope</span>
    </header>
    <section class="bg-neutral-800 border border-neutral-700 rounded-xl p-5 mt-6">
        <h2 class="text-xl font-bold text-white">Ajouter une série</h2>
        <p class="text-sm text-neutral-400">Les champs marqués d'un * sont obligatoires.</p>
        <form class="mt-5 flex flex-col gap-4">
            <div class="flex flex-col gap-4 md:flex-row">
                <div class="flex-1">
                    <label for="nom" class="block text-sm font-semibold mb-1 text-white">Nom de la série *</label>
                    <input id="nom" type="text" placeholder="Ex. The Bear"
                        class="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-3 text-sm" />
                </div>
                <div class="flex-1">
                    <label for="genres" class="block text-sm font-semibold mb-1">
                        Genre(s) * <span class="text-xs text-neutral-400 font-normal">séparés par des virgules</span>
                    </label>
                    <input id="genres" type="text" placeholder="Ex. Drame, Comédie "
                        class="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-3 text-sm" />
                </div>>
        </form>
    </section>

    <section class="deuxieme_section">
        <h2 class="text-xl font-bold text-white">Catalogue des séries</h2>
        <p class="mt-1 text-sm text-slate-300">Recherche par nom ou explore un genre.</p>
        <form
            class="catalogue__filters mt-4 flex flex-col gap-4 rounded-xl border border-slate-700 bg-slate-900/60 p-4 md:flex-row md:items-end">
            <div class="filter flex flex-1 flex-col gap-1">
                <label for="search" class="text-sm font-semibold text-white">Recherche</label>
                <input type="search" id="search" placeholder="Ex. Breaking Bad"
                    class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
            <div class="filter flex flex-1 flex-col gap-2">
                <label for="genre" class="text-sm font-semibold text-white">Genre</label>
                <select id="genre"
                    class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    <option value="" class=" text-slate-200">Tous les genres</option>
                </select>
            </div>
            <button type="reset" id="reset-btn"
                class="rounded-lg border border-slate-600 bg-slate-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400">Réinitialiser</button>
        </form>
        <div class="catalogue">

        </div>
    </section>
</body>
<script src="script.js"></script>

</html>
